[package]
name = "agent-forge-core"
version = "0.1.0"
edition = "2024"
description = "Minimal requirements, evidence, and event-journal core for an agent-oriented forge prototype"
publish = false

# SPDX export hint only; Cargo's own license field remains unset. NOASSERTION
# makes no declared-license assertion and grants no rights.
[package.metadata.agent-forge.licensing]
decision = "no_license_selected"
redistribution_rights = "not_assessed"
spdx_package_license_declared = "NOASSERTION"

[features]
test-crash-injection = []

[dependencies]
hex = "=0.4.3"
hmac = "=0.12.1"
ed25519-dalek = "=3.0.0"
libc = "=0.2.190"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
